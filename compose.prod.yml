# Production WAHA (e.g. a DigitalOcean droplet), behind Caddy for HTTPS.
# WAHA publishes no ports itself; only Caddy on 80/443 is reachable.
#
#   cd ~/waha
#   docker compose -f compose.prod.yml up -d
#
services:
  waha:
    # :gows has no browser inside (3.2 GB vs 4.2 GB for :latest on x86),
    # which matters on a 10 GB droplet.
    image: ${WAHA_IMAGE:-devlikeapro/waha:gows}
    restart: unless-stopped
    env_file: .env
    environment:
      # GOWS needs no browser, so it fits a 512 MB droplet. WEBJS (Chromium)
      # uses ~850 MB for one session. Overrides the value in .env.
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-GOWS}
      # The Laravel admin links the number (QR) and sends messages through the
      # API, so the public dashboard and Swagger UI are off. To use them
      # temporarily, set WAHA_UI=True in .env and recreate the container.
      WAHA_DASHBOARD_ENABLED: ${WAHA_UI:-False}
      WHATSAPP_SWAGGER_ENABLED: ${WAHA_UI:-False}
    volumes:
      - ./sessions:/app/.sessions

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      WAHA_DOMAIN: ${WAHA_DOMAIN:?Set WAHA_DOMAIN in .env, e.g. waha.yourdomain.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - waha

volumes:
  caddy_data:
